<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 50px;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
  }
  .pet {
    width: 200px;
    height: 200px;
  }
  .label {
    color: white;
    text-align: center;
    font-family: sans-serif;
  }
  .item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
</style>
</head>
<body>
<div class="item"><img class="pet" src="pet.png"><div class="label">idle</div></div>
<div class="item"><img class="pet" src="pet-eye-closed.png"><div class="label">blink</div></div>
<div class="item"><img class="pet" src="pet-sleep.png"><div class="label">sleep</div></div>
<div class="item"><img class="pet" src="pet-sing.png"><div class="label">sing</div></div>
<div class="item"><img class="pet" src="pet-wave.png"><div class="label">wave</div></div>
</body>
</html>
