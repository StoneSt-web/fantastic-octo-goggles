# GitHub Actions: 每次 push / PR 跑 syntax check
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Syntax check all JS files
        run: |
          set -e
          for f in $(find src scripts -name "*.js"); do
            echo "checking $f"
            node --check "$f" || (echo "❌ $f failed syntax check" && exit 1)
          done
          echo "✅ All JS files pass syntax check"
      - name: Verify package.json valid
        run: node -e "const p = require('./package.json'); console.log('version:', p.version, '| name:', p.name, '| license:', p.license);"
