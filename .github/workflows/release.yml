# GitHub Actions: v1.0.0 release 自动打包 + 上传
#
# 触发方式: push tag v* (例如 v1.0.0)
# 输出: Windows .exe + macOS .dmg 上传到对应 GitHub Release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # icon.ico + iconset/ 已经在 git 里(手动生成,已 commit),不需要重新跑 Python 脚本
      # 如果改了皮肤,记得本地跑 `python scripts/make-app-icon.py` 后再 commit

      # 7z on Windows 默认解压会试图给 darwin 平台的 .dylib 建 symlink,
      # 但 GitHub Actions Windows runner 缺 SeCreateSymbolicLinkPrivilege → 失败.
      # 解决方案: 先用 7z 的 -snld(skip symlink dereference)自己解,让 symlink 变普通文件.
      # Windows runner 默认没装 7z,先用 action 装.
      - name: Install 7-Zip (Windows only)
        if: matrix.os == 'windows-latest'
        uses: kiedtl/7zip-windows@v1

      - name: Pre-extract winCodeSign (bypass symlink permission)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\electron-builder\Cache"
          $ver = "2.6.0"
          $wcPath = "$cache\winCodeSign\$ver"
          $url = "$env:ELECTRON_BUILDER_BINARIES_MIRROR/winCodeSign-$ver/winCodeSign-$ver.7z"
          $archive = "$env:RUNNER_TEMP\winCodeSign-$ver.7z"
          if (-not (Test-Path "$wcPath\darwin")) {
            Write-Host "Pre-extracting winCodeSign v$ver to bypass symlink issue..."
            Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
            New-Item -ItemType Directory -Path $wcPath -Force | Out-Null
            # -snld: 不解析 symlink,把符号链接当普通文件解压 (避免权限报错)
            $sevenZip = Get-Command 7z -ErrorAction Stop
            & $sevenZip.Source x $archive "-o$wcPath" -y -snld | Out-Null
            Write-Host "  -> $wcPath"
          }

      # electron-builder 看到 tag v* 会自动尝试 publish 到 GitHub,
      # 但 workflow 自己用 softprops/action-gh-release 发 release,重复 + 权限不足(403).
      # --publish never: 只打包,不让 electron-builder publish.
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 加速 electron / winCodeSign / nsis 下载(国内 runner 偶尔慢)
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # macOS 镜像(可选)
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: warn

      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
